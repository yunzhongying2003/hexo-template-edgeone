# ---------------------------------------------------------------
# Scheme Settings
# ---------------------------------------------------------------

# Schemes
scheme: Pisces

# ---------------------------------------------------------------
# Sidebar Settings
# ---------------------------------------------------------------

sidebar:
  # Sidebar position. Available values: left | right
  position: left

  # Sidebar width.
  width_expanded: 320
  width_dual_column: 240

  # Sidebar display.
  # Available values:
  #  - post    expand on posts automatically. Default.
  #  - always  expand for all pages automatically.
  #  - hide    expand only when click on the sidebar toggle icon.
  #  - remove  totally remove sidebar including sidebar toggle.
  display: always

  # Sidebar padding in pixels.
  padding: 18
  # Sidebar offset from top menubar in pixels (only for Pisces | Gemini).
  offset: 12

# ---------------------------------------------------------------
# Custom file paths (enable bodyEnd for blog interactions JS)
# ---------------------------------------------------------------
custom_file_path:
  bodyEnd: source/_data/body-end.njk
  # footer: source/_data/footer.njk  # disabled

# ---------------------------------------------------------------
# Word Count & Reading Time
# ---------------------------------------------------------------
symbols_count_time:
  total_symbols: false
  total_time: false

# ---------------------------------------------------------------
# Menu Settings
# ---------------------------------------------------------------

menu:
  home: / || fa fa-home
  graph: /graph/ || fa fa-project-diagram
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags

menu_settings:
  icons: true
  badges: true

# ---------------------------------------------------------------
# Social Links
# ---------------------------------------------------------------

social:
  X: https://x.com/jousmar433946 || fab fa-x-twitter
  E-Mail: mailto:yunzhongying2003@163.com || fa fa-envelope

social_icons:
  enable: true
  icons_only: false
  transition: false

# ---------------------------------------------------------------
# Blog rolls
# ---------------------------------------------------------------

links_settings:
  icon: fa fa-globe
  layout: block

links:
  # Example: Title: https://example.com

# ---------------------------------------------------------------
# Avatar
# ---------------------------------------------------------------

avatar:
  url: https://avatars.githubusercontent.com/yunzhongying2003
  rounded: true
  rotated: false

# ---------------------------------------------------------------
# Table of Contents
# ---------------------------------------------------------------

toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 6

# ---------------------------------------------------------------
# Post Settings
# ---------------------------------------------------------------

post_settings:
  word_count: true
  min2read: true
  copyright: true

# ---------------------------------------------------------------
# Footer Settings
# ---------------------------------------------------------------

footer:
  since: 2024
  powered_by: true
  theme: true

# ---------------------------------------------------------------
# Local Search
# ---------------------------------------------------------------
# Dependencies: hexo-generator-searchdb
local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: false

# ---------------------------------------------------------------
# Busuanzi (Visitor Counter)
# ---------------------------------------------------------------
busuanzi_count:
  enable: false
  post_views_icon: far fa-eye

# ---------------------------------------------------------------
# Image zoom - click to view original size
# ---------------------------------------------------------------
fancybox: false
mediumzoom: true

# ---------------------------------------------------------------
# GitHub banner (top-right corner)
# ---------------------------------------------------------------
github_banner:
  enable: true
  permalink: https://github.com/yunzhongying2003
